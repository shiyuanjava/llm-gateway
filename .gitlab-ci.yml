stages:
  - verify
  - image
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  GATEWAY_IMAGE: "$CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHA"
  UI_IMAGE: "$CI_REGISTRY_IMAGE/ui:$CI_COMMIT_SHA"
  # 浅克隆:服务器磁盘小,所有 Job 都不需要完整历史
  GIT_DEPTH: "20"

cache:
  paths:
    - .m2/repository/
    - llm-gateway-ui/.npm/

backend_test:
  stage: verify
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: mysql:8.4
      alias: mysql
      # 服务容器专属变量(优先级高于 Job 变量)。坑:GitLab 会把 Job 级 variables 整体注入
      # service 容器,而官方 mysql 镜像禁止 MYSQL_USER=root——这里显式置空抵消泄漏。
      # 该数据库只存在于当前 Job,结束后自动销毁。
      variables:
        MYSQL_ROOT_PASSWORD: "ci-test-mysql-password"
        MYSQL_ROOT_HOST: "%"
        MYSQL_DATABASE: "llm_gateway"
        MYSQL_USER: ""
        MYSQL_PASSWORD: ""
  variables:
    # 以下供被测应用读取(application.yaml 的 ${MYSQL_*} 占位符);集成测试执行 Flyway 访问真 MySQL
    MYSQL_HOST: "mysql"
    MYSQL_PORT: "3306"
    MYSQL_DB: "llm_gateway"
    MYSQL_USER: "root"
    MYSQL_PASSWORD: "ci-test-mysql-password"
    # 测试环境用环境变量注入即可(环境变量优先级高于 Nacos);生产密钥在 Nacos,不在 CI 变量里
    GATEWAY_JWT_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"
    # CI 里没有 Nacos/Sentinel:显式关闭,否则 nacos-client 对 localhost:8848 反复重连,
    # 每个测试上下文都卡住数分钟(限流/缓存在测试中本就走内存实现,不受影响)
    NACOS_DISCOVERY_ENABLED: "false"
    SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
    SPRING_CLOUD_SENTINEL_ENABLED: "false"
  before_script:
    # Maven Central 国内直连极慢:本 Job 容器内写入阿里云 mirror(与 .m2 缓存叠加,首次绿后增量下载)
    - mkdir -p ~/.m2
    - printf '<settings><mirrors><mirror><id>aliyun</id><mirrorOf>central</mirrorOf><url>https://maven.aliyun.com/repository/public</url></mirror></mirrors></settings>' > ~/.m2/settings.xml
    # MySQL 初始化需要十几秒,等 3306 真正可连再开跑(初始化期的临时实例不监听 TCP,探测可靠)
    - timeout 120 bash -c 'until (echo > /dev/tcp/mysql/3306) 2>/dev/null; do sleep 2; done'
  script:
    - cd llm-gateway
    - mvn --batch-mode test
  artifacts:
    when: always
    reports:
      junit: llm-gateway/target/surefire-reports/TEST-*.xml

frontend_build:
  stage: verify
  image: node:20-alpine
  before_script:
    - cd llm-gateway-ui
    # npm 官方源国内慢,走 npmmirror
    - npm config set registry https://registry.npmmirror.com
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - llm-gateway-ui/dist/
    expire_in: 7 days

# 当前仓库已有部分历史文件未按 Prettier 重写，先把格式检查作为质量提示，
# 避免它阻断部署；逐步格式化存量文件后可删除 allow_failure。
frontend_format:
  stage: verify
  image: node:20-alpine
  before_script:
    - cd llm-gateway-ui
    - npm config set registry https://registry.npmmirror.com
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run format:check
  allow_failure: true

# 镜像在京东云构建 Runner 中生成并推到 HTTPS Registry；腾讯云只拉取不可变 SHA 镜像。
build_images:
  stage: image
  image: docker:27-cli
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: docker:27-dind
      alias: docker
      command:
        # 京东云未备案,Registry 用 IP + 私有 CA(见部署手册 3 章)。dind 的 daemon 读不到
        # 宿主机 /etc/docker/certs.d,且卷挂载语法无法表达带端口的目录名,故跳过校验。
        # 这一跳是京东云本机内部(dind → 本机 Registry),仍是 TLS;跨机拉取由腾讯云
        # /etc/docker/certs.d/117.72.220.94:5050/ca.crt 完整校验,那里不放宽。
        - --insecure-registry=117.72.220.94:5050
        - --registry-mirror=https://docker.m.daocloud.io
        - --registry-mirror=https://docker.1ms.run
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$GATEWAY_IMAGE" llm-gateway
    - docker build --pull --build-arg VITE_API_BASE= -t "$UI_IMAGE" llm-gateway-ui
    - docker push "$GATEWAY_IMAGE"
    - docker push "$UI_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_production:
  stage: deploy
  tags: [ztmdcg-production]
  needs: [build_images]
  variables:
    GIT_DEPTH: "1"
    DOCKER_HOST: "unix:///var/run/docker.sock"
  script:
    - bash deploy/scripts/deploy-production.sh
  environment:
    name: production
    url: https://gateway.ztmdcg.cn
  resource_group: llm-gateway-production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
