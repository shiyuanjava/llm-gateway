spring:
  datasource:
    password: ${MYSQL_PASSWORD}
  flyway:
    placeholders:
      purge_demo_api_keys: "true"

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,controlRedis
        liveness:
          include: livenessState

server:
  forward-headers-strategy: framework

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:${GATEWAY_ADMIN_ALLOWED_ORIGINS:${gateway.admin.allowed-origins:}}}
  redis:
    environment: ${GATEWAY_ENVIRONMENT:prod}
    health-enabled: true
  cache:
    store: ${GATEWAY_CACHE_STORE:redis}
