spring:
  application:
    name: llm-gateway
  config:
    import: "optional:nacos:llm-gateway.yaml"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        file-extension: yaml
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      eager: true
      datasource:
        param-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            data-id: llm-gateway-param-flow-rules
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: param-flow
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-null-for-primitives: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:llm_gateway}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    placeholders:
      purge_demo_api_keys: "false"

server:
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5
  global-config:
    db-config:
      id-type: auto

management:
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:9090}
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:${GATEWAY_ADMIN_ALLOWED_ORIGINS:${gateway.admin.allowed-origins:http://localhost:5173}}}
    max-age-seconds: ${GATEWAY_CORS_MAX_AGE_SECONDS:3600}
  routing:
    default-model: deepseek-v4-pro
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    model: ${LLM_MODEL:deepseek-v4-pro}
  providers:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      base-url: https://api.anthropic.com/v1
      api-key: ${ANTHROPIC_API_KEY:}
    mock:
      base-url: ""
      api-key: ""
  rate-limit:
    store: ${GATEWAY_RATE_LIMIT_STORE:memory}
    requests-per-minute: 60
  quota:
    tokens-per-tenant: 1000000
  cache:
    enabled: true
    store: ${GATEWAY_CACHE_STORE:memory}
    ttl-seconds: 300
    semantic:
      enabled: false
      similarity-threshold: 0.92
  redis:
    namespace: ${GATEWAY_REDIS_NAMESPACE:llmgw}
    environment: ${GATEWAY_ENVIRONMENT:local}
    health-enabled: ${GATEWAY_REDIS_HEALTH_ENABLED:false}
    cache-max-value-bytes: ${GATEWAY_REDIS_CACHE_MAX_VALUE_BYTES:524288}
    circuit:
      failure-threshold: ${GATEWAY_REDIS_CIRCUIT_FAILURE_THRESHOLD:3}
      open-duration: ${GATEWAY_REDIS_CIRCUIT_OPEN_DURATION:2s}
    control:
      mode: ${GATEWAY_REDIS_CONTROL_MODE:standalone}
      nodes: ["${GATEWAY_REDIS_CONTROL_NODE:${REDIS_HOST:localhost}:${REDIS_PORT:6379}}"]
      master: ${GATEWAY_REDIS_CONTROL_MASTER:}
      username: ${GATEWAY_REDIS_CONTROL_USERNAME:}
      password: ${GATEWAY_REDIS_CONTROL_PASSWORD:${REDIS_PASSWORD:}}
      database: ${GATEWAY_REDIS_CONTROL_DATABASE:0}
      max-redirects: ${GATEWAY_REDIS_CONTROL_MAX_REDIRECTS:5}
      ssl: ${GATEWAY_REDIS_CONTROL_SSL:false}
      command-timeout: ${GATEWAY_REDIS_CONTROL_COMMAND_TIMEOUT:500ms}
    cache:
      mode: ${GATEWAY_REDIS_CACHE_MODE:standalone}
      nodes: ["${GATEWAY_REDIS_CACHE_NODE:${REDIS_HOST:localhost}:${REDIS_PORT:6379}}"]
      master: ${GATEWAY_REDIS_CACHE_MASTER:}
      username: ${GATEWAY_REDIS_CACHE_USERNAME:}
      password: ${GATEWAY_REDIS_CACHE_PASSWORD:${REDIS_PASSWORD:}}
      database: ${GATEWAY_REDIS_CACHE_DATABASE:0}
      max-redirects: ${GATEWAY_REDIS_CACHE_MAX_REDIRECTS:5}
      ssl: ${GATEWAY_REDIS_CACHE_SSL:false}
      command-timeout: ${GATEWAY_REDIS_CACHE_COMMAND_TIMEOUT:250ms}
  guardrail:
    sensitive-words: ["制造炸弹", "自杀方法"]
  resilience:
    max-retries: 2
    circuit-breaker:
      failure-threshold: 5
      open-seconds: 30
  http:
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    stream-max-duration-ms: 300000
  admin:
    jwt-secret: ${GATEWAY_JWT_SECRET:}
    jwt-secrets-fallback: ${GATEWAY_JWT_SECRETS_FALLBACK:}
    token-ttl-minutes: 120
    bootstrap-username: ${ADMIN_USERNAME:}
    bootstrap-password: ${ADMIN_PASSWORD:}
