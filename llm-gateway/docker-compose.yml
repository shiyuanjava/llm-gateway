services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: llm_gateway
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v3.1.1
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLED: "false"
      NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
      NACOS_AUTH_IDENTITY_KEY: nacos-local
      NACOS_AUTH_IDENTITY_VALUE: nacos-local
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:8850:8080"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  nacos-init:
    image: curlimages/curl:8.10.1
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./deploy/nacos-init/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:latest
    ports:
      - "127.0.0.1:8858:8858"
    restart: unless-stopped

  gateway:
    image: ${GATEWAY_IMAGE:-llm-gateway-gateway:local}
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: llm_gateway
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GATEWAY_CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      GATEWAY_ENVIRONMENT: prod
      GATEWAY_REDIS_CONTROL_NODE: redis:6379
      GATEWAY_REDIS_CACHE_NODE: redis:6379
      GATEWAY_REDIS_CONTROL_MODE: standalone
      GATEWAY_REDIS_CACHE_MODE: standalone
      NACOS_SERVER_ADDR: nacos:8848
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      GATEWAY_RATE_LIMIT_STORE: sentinel
      JAVA_TOOL_OPTIONS: "-DJM.LOG.PATH=/app/logs/nacos -Dnacos.logging.default.config.enabled=false -Dcsp.sentinel.log.dir=/app/logs/sentinel"
      TZ: Asia/Shanghai
    volumes:
      - gateway-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ui:
    image: ${UI_IMAGE:-llm-gateway-ui:local}
    build:
      context: ../llm-gateway-ui
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-30000}
        VITE_STREAM_TIMEOUT_MS: ${VITE_STREAM_TIMEOUT_MS:-310000}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  gateway-logs:
