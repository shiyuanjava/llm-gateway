# CI 测试容器的 Redis 配置。RedisResponseCacheIntegrationTest 默认连 127.0.0.1:16379
# （可用 -Dredis.test.port 覆盖），故这里监听 16379 而非默认 6379。
bind 127.0.0.1
port 16379
# 一次性测试容器：不需要持久化，关掉 RDB 快照避免 fork 开销与磁盘占用
save ""
appendonly no
# 数据集很小，给个上限防止异常用例把内存吃满
maxmemory 256mb
maxmemory-policy allkeys-lru
daemonize no
logfile /var/log/redis/redis-ci.log
dir /var/lib/redis
